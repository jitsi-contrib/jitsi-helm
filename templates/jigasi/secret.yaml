{{- if and
       (or
          .Values.jigasi.enabled
          .Values.transcriber.enabled
       )
       (not .Values.jigasi.xmpp.existingSecretName)
}}
{{- $secretName := include "jitsi-meet.jigasi.secret" . }}
{{- $kept := include "jitsi-meet.existingSecretValue"
      (dict "ctx" $ "name" $secretName "key" "JIGASI_XMPP_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jitsi-meet.jigasi.labels" . | nindent 4 }}
type: Opaque
stringData:
  JIGASI_XMPP_USER: {{ .Values.jigasi.xmpp.user | quote }}
  JIGASI_XMPP_PASSWORD: {{ .Values.jigasi.xmpp.password
                           | default $kept
                           | default (randAlphaNum 10)
                           | quote }}
{{- end }}

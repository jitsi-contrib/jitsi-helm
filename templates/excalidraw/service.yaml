{{- if .Values.excalidraw.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jitsi-meet.excalidraw.fullname" . }}
  labels:
    {{- include "jitsi-meet.excalidraw.labels" . | nindent 4 }}
  {{- with .Values.excalidraw.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.excalidraw.service.type }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.excalidraw.service.port }}
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics
  selector:
    {{- include "jitsi-meet.excalidraw.selectorLabels" . | nindent 4 }}
{{- end }}

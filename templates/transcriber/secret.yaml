{{- if and
       .Values.transcriber.enabled
       (not .Values.transcriber.xmpp.existingSecretName)
}}
{{- $secretName := include "jitsi-meet.transcriber.secret" . }}
{{- $kept := include "jitsi-meet.existingSecretValue"
      (dict "ctx" $ "name" $secretName "key" "JIGASI_TRANSCRIBER_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jitsi-meet.transcriber.labels" . | nindent 4 }}
type: Opaque
stringData:
  JIGASI_TRANSCRIBER_USER: {{ .Values.transcriber.xmpp.user | quote }}
  JIGASI_TRANSCRIBER_PASSWORD: {{ .Values.transcriber.xmpp.password
                                  | default $kept
                                  | default (randAlphaNum 10)
                                  | quote }}
{{- end }}


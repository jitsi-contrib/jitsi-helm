{{- if .Values.opusTranscriberProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jitsi-meet.opus-transcriber-proxy.fullname" . }}
  labels:
    {{- include "jitsi-meet.opus-transcriber-proxy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.opusTranscriberProxy.service.port }}
  selector:
    {{- include "jitsi-meet.opus-transcriber-proxy.selectorLabels" . | nindent 4 }}
{{- end }}

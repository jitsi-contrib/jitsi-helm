{{- if not .Values.jvb.xmpp.existingSecretName }}
{{- $secretName := include "jitsi-meet.jvb.secret" . }}
{{- $kept := include "jitsi-meet.existingSecretValue"
      (dict "ctx" $ "name" $secretName "key" "JVB_AUTH_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jitsi-meet.jvb.labels" . | nindent 4 }}
type: Opaque
stringData:
  JVB_AUTH_USER: {{ .Values.jvb.xmpp.user | quote }}
  JVB_AUTH_PASSWORD: {{ .Values.jvb.xmpp.password
                        | default $kept
                        | default (randAlphaNum 10)
                        | quote }}
{{- end }}

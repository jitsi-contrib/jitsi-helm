{{/*
All pods of a JVB Deployment are reachable on the same Service port, so they
would receive each other's traffic. Use portRangeSize to run more than one JVB.
This does not apply to hostPort/hostNetwork, where no Service is created and
each pod is reachable on its own node IP.
*/}}
{{- if and
       .Values.jvb.service.enabled
       (not .Values.jvb.useHostPort)
       (not .Values.jvb.useHostNetwork)
       (gt (int .Values.jvb.replicaCount) 1)
}}
{{-   fail "jvb.replicaCount must be 1 when the JVB service is enabled. Use jvb.portRangeSize to run multiple JVBs." }}
{{- end }}

{{- $basePort := .Values.jvb.UDPPort }}
{{- $rangeSize := .Values.jvb.portRangeSize | default 1 }}

{{- range $i := until (int $rangeSize) }}
{{- $udpPort := add $basePort $i }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jitsi-meet.jvb.fullname" $ }}-{{ $i }}
  labels:
    {{- include "jitsi-meet.jvb.labels" $ | nindent 4 }}
    instance: {{ $i | quote }}
    {{- with $.Values.jvb.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $.Values.jvb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $.Values.jvb.replicaCount }}
  selector:
    matchLabels:
      {{- include "jitsi-meet.jvb.selectorLabels" $ | nindent 6 }}
      instance: {{ $i | quote }}
  {{- if $.Values.jvb.useHostPort }}
  strategy:
    type: Recreate
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "jitsi-meet.jvb.selectorLabels" $ | nindent 8 }}
        instance: {{ $i | quote }}
        {{- with (mergeOverwrite (dict) $.Values.global.podLabels $.Values.jvb.podLabels) }}
        {{- toYaml . | nindent 8  }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/jvb/configmap.yaml") $ | sha256sum | quote }}
        checksum/config-extrafiles: {{ include (print $.Template.BasePath "/jvb/configmap-extrafiles.yaml") $ | sha256sum | quote }}
        checksum/secret: {{ include (print $.Template.BasePath "/jvb/secret.yaml") $ | sha256sum | quote }}
        {{- if and
               $.Values.jvb.metrics.enabled
               $.Values.jvb.metrics.prometheusAnnotations
        }}
        prometheus.io/port: "9888"
        prometheus.io/scrape: "true"
        {{- end }}
        {{- with (mergeOverwrite (dict) $.Values.global.podAnnotations $.Values.jvb.podAnnotations) }}
        {{- toYaml . | nindent 8  }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.jvb.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jitsi-meet.serviceAccountName" $ }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.jvb.podSecurityContext | nindent 8 }}
      {{- if $.Values.jvb.useHostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- if $.Values.jvb.extraFiles }}
        - name: extra-files
          configMap:
            name: {{ include "jitsi-meet.jvb.fullname" $ }}-extrafiles
            items:
              {{- range $i, $f := $.Values.jvb.extraFiles }}
              - key: extrafile-{{ $i }}
                path: extrafile-{{ $i }}
                {{- with $f.mode }}
                mode: {{ . }}
                {{- end }}
              {{- end }}
        {{- end }}
        {{- with $.Values.jvb.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ $.Values.jvb.image.repository }}:{{ $.Values.jvb.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ pluck "pullPolicy" $.Values.jvb.image $.Values.image | first }}
          securityContext:
            {{- toYaml $.Values.jvb.securityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "jitsi-meet.jvb.secretName" $ }}
            - configMapRef:
                name: {{ include "jitsi-meet.common" $ }}
            - configMapRef:
                name: {{ include "jitsi-meet.jvb.fullname" $ }}
            {{- range $.Values.jvb.extraEnvFrom }}
            - {{  tpl (toYaml .) $ | indent 14 | trim }}
            {{- end }}
            {{- if $.Values.global.releaseSecretsOverride.enabled }}
            {{-   range $.Values.global.releaseSecretsOverride.extraEnvFrom }}
            - {{    tpl (toYaml .) $ | indent 14 | trim }}
            {{-   end }}
            {{- end }}
          env:
            - name: JVB_PORT
              value: {{ $udpPort | quote }}
            {{- if $.Values.jvb.publicIPs }}
            - name: JVB_ADVERTISE_IPS
              value: {{ $.Values.jvb.publicIPs | join "," | quote }}
            {{- else if $.Values.jvb.useNodeIP }}
            - name: JVB_ADVERTISE_IPS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- end }}
            {{- if  $.Values.octo.enabled }}
            - name: JVB_OCTO_BIND_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JVB_OCTO_RELAY_ID
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
          ports:
            - name: rtp-udp-{{ $i }}
              containerPort: {{ $udpPort }}
              {{- if $.Values.jvb.useHostPort }}
              hostPort: {{ $udpPort }}
              {{- end }}
              protocol: UDP
            # The health port the probes target.
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with $.Values.jvb.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.jvb.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $.Values.jvb.resources | nindent 12 }}
          volumeMounts:
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            {{- range $i, $f := $.Values.jvb.extraFiles }}
            - name: extra-files
              mountPath: {{ $f.path }}
              subPath: extrafile-{{ $i }}
              readOnly: true
            {{- end }}
            {{- with $.Values.jvb.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        {{- if $.Values.jvb.metrics.enabled }}
        - name: metrics
          image: {{ $.Values.jvb.metrics.image.repository }}:{{ $.Values.jvb.metrics.image.tag }}
          imagePullPolicy: {{ $.Values.jvb.metrics.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.jvb.metrics.securityContext | nindent 12 }}
          command:
            - /prometheus-jitsi-meet-exporter
            - -videobridge-url
            - http://localhost:8080/colibri/stats
          ports:
            - containerPort: 9888
              name: tcp-metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 9888
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml $.Values.jvb.metrics.resources | nindent 12 }}
            {{- end }}

      {{- with $.Values.jvb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.jvb.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.jvb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

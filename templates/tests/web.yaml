apiVersion: v1
kind: Pod
metadata:
  name: {{ include "jitsi-meet.web.fullname" . }}-test
  labels:
    {{- include "jitsi-meet.web.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: "test"
    helm.sh/hook-delete-policy: "hook-succeeded"
spec:
  containers:
    - name: web-smoke-test
      image: busybox:1.38.0
      imagePullPolicy: IfNotPresent
      # "-O -" writes the response to stdout. Downloading to a file would fail
      # with the read-only root filesystem set below.
      command: ["wget"]
      args:
        - "-q"
        - "-O"
        - "-"
        - 'http://{{ include "jitsi-meet.web.fullname" . }}:{{ .Values.web.service.port }}'
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
  restartPolicy: Never

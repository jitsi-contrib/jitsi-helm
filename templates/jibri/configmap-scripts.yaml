{{- if and
       .Values.jibri.enabled
       (not .Values.jibri.useExternalJibri)
       .Values.jibri.custom.scripts._config
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jitsi-meet.jibri.fullname" . }}-scripts
  labels:
    {{- include "jitsi-meet.jibri.labels" . | nindent 4 }}
data:
  config: |
    {{- .Values.jibri.custom.scripts._config | nindent 4 }}
{{- end }}

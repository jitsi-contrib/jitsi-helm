{{- if and
       .Values.jibri.enabled
       (not .Values.jibri.recorder.existingSecretName)
}}
{{- $secretName := include "jitsi-meet.jibri.recorderSecret" . }}
{{- $kept := include "jitsi-meet.existingSecretValue"
      (dict "ctx" $ "name" $secretName "key" "JIBRI_RECORDER_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jitsi-meet.jibri.labels" . | nindent 4 }}
type: Opaque
stringData:
  JIBRI_RECORDER_USER: {{ .Values.jibri.recorder.user | quote }}
  JIBRI_RECORDER_PASSWORD: {{ .Values.jibri.recorder.password
                              | default $kept
                              | default (randAlphaNum 10)
                              | quote }}
{{- end }}

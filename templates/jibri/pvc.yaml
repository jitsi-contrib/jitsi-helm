{{- if and
       .Values.jibri.enabled
       (not .Values.jibri.useExternalJibri)
       .Values.jibri.persistence.enabled
       (not .Values.jibri.persistence.existingClaim)
}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "jitsi-meet.jibri.fullname" . }}
  labels:
    {{- include "jitsi-meet.jibri.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.jibri.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.jibri.persistence.size | quote }}
  {{- with .Values.jibri.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end -}}

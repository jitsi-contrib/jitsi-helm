{{- if and
       .Values.jibri.enabled
       (not .Values.jibri.xmpp.existingSecretName)
}}
{{- $secretName := include "jitsi-meet.jibri.xmppSecret" . }}
{{- $kept := include "jitsi-meet.existingSecretValue"
      (dict "ctx" $ "name" $secretName "key" "JIBRI_XMPP_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jitsi-meet.jibri.labels" . | nindent 4 }}
type: Opaque
stringData:
  JIBRI_XMPP_USER: {{ .Values.jibri.xmpp.user | quote }}
  JIBRI_XMPP_PASSWORD: {{ .Values.jibri.xmpp.password
                          | default $kept
                          | default (randAlphaNum 10)
                          | quote }}
{{- end }}

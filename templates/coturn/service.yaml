{{- if .Values.coturn.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jitsi-meet.coturn.fullname" . }}
  labels:
    {{- include "jitsi-meet.coturn.labels" . | nindent 4 }}
  {{- with .Values.coturn.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.coturn.service.type }}
  {{- if eq .Values.coturn.service.type "LoadBalancer" }}
  allocateLoadBalancerNodePorts: {{ .Values.coturn.service.allocateLoadBalancerNodePorts }}
  {{- end }}
  {{- if and
         .Values.coturn.turns.enabled
         .Values.coturn.turns.certificate.acmeProxy.enabled
  }}
  publishNotReadyAddresses: true
  {{- end }}
  {{- with .Values.coturn.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  ports:
    {{- $transports := splitList "," .Values.coturn.turn.transport }}
    {{- $turnPort := int .Values.coturn.service.ports.turn }}
    {{- $turnsPort := int .Values.coturn.service.ports.turns }}
    {{- if has "udp" $transports }}
    - name: udp-turn
      protocol: UDP
      port: {{ $turnPort }}
      targetPort: udp-turn
    {{- end }}
    {{- if has "tcp" $transports }}
    - name: tcp-turn
      protocol: TCP
      port: {{ $turnPort }}
      targetPort: tcp-turn
    {{- end }}
    {{- /* Skip when a plain TCP port already covers the same public port */}}
    {{- if and
           .Values.coturn.turns.enabled
           (not (and (has "tcp" $transports) (eq $turnsPort $turnPort)))
    }}
    - name: tcp-turns
      protocol: TCP
      port: {{ $turnsPort }}
      targetPort: tcp-turn
    {{- end }}
    {{- if and
           .Values.coturn.turns.enabled
           .Values.coturn.turns.certificate.acmeProxy.enabled
    }}
    - name: http-acme
      protocol: TCP
      port: 80
      targetPort: 8080
    {{- end }}
  selector:
    {{- include "jitsi-meet.coturn.selectorLabels" . | nindent 4 }}
{{- end }}

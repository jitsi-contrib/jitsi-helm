{{- if or
       .Values.jicofo.custom.configs._custom_jicofo_conf
       .Values.opusTranscriberProxy.enabled
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jitsi-meet.jicofo.fullname" . }}-configs
  labels:
    {{- include "jitsi-meet.jicofo.labels" . | nindent 4 }}
data:
  custom-jicofo.conf: |
    {{- if .Values.opusTranscriberProxy.enabled }}
    jicofo {
      transcription {
        url-template = "{{ include "jitsi-meet.opus-transcriber-proxy.urlTemplate" . }}"
      }
    }
    {{- end }}
    {{- with .Values.jicofo.custom.configs._custom_jicofo_conf }}
    {{- . | nindent 4 }}
    {{- end }}
{{- end }}

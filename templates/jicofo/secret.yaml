{{- if not .Values.jicofo.xmpp.existingSecretName }}
{{- $secretName := include "jitsi-meet.jicofo.secret" . }}
{{- $kept := include "jitsi-meet.existingSecretValue"
      (dict "ctx" $ "name" $secretName "key" "JICOFO_AUTH_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jitsi-meet.jicofo.labels" . | nindent 4 }}
type: Opaque
stringData:
  JICOFO_AUTH_PASSWORD: {{ .Values.jicofo.xmpp.password
                           | default $kept
                           | default (randAlphaNum 10)
                           | quote }}
{{- end }}

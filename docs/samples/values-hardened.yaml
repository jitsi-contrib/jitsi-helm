# -----------------------------------------------------------------------------
# This is a sample config. Assumed that:
# - Jitsi domain is meet.example.com
# - Read-only filesystems
# - Non-root containers
#
# The Jitsi components and Coturn are hardened by the chart itself, so nothing
# is needed for them here. Etherpad and Excalidraw are third-party images which
# the chart does not harden, so their settings are shown below.
# See /docs/guides/security.md
# -----------------------------------------------------------------------------
#publicURL: ""
publicURL: "https://meet.example.com"

websockets:
  xmpp:
    #enabled: false
    enabled: true

web:
  ingress:
    #enabled: false
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: meet.example.com
        paths: ["/"]
    tls:
      - secretName: jitsi-web-tls
        hosts:
          - meet.example.com

jvb:
  #useNodeIP: false
  useNodeIP: true

  #useHostPort: false
  useHostPort: true
  UDPPort: 10000

  service:
    #enabled: true
    enabled: false

jibri:
  enabled: true

  shm:
    enabled: true
    useHost: false
    size: 2Gi

excalidraw:
  enabled: true

  metrics:
    enabled: true

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  # In readOnly environments, Excalidraw needs write permission for
  # the following folder
  extraVolumes:
    - name: dist
      emptyDir:
        sizeLimit: 32Mi

  extraVolumeMounts:
    - name: dist
      mountPath: /excalidraw-backend/dist

etherpad:
  enabled: true

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 5001
    seccompProfile:
      type: RuntimeDefault

  extraEnvs:
    NODE_ENV: production
    # Note: move this to a secret
    ADMIN_PASSWORD: admin
    # Select a supported database from here:
    #   https://www.npmjs.com/package/ueberdb2
    # By default, it uses Sqlite.
    DB_TYPE: "sqlite"
    DB_FILENAME: "var/etherpad.sq3"
    #DB_USER: etherpad
    #DB_HOST: postgres
    #DB_NAME: etherpad
    #DB_PASS: etherpad
    #DB_PORT: 5432
    # For now, DEFAULT_PAD_TEXT cannot be unset or empty.
    # It seems to be mandatory in the latest version of Etherpad.
    DEFAULT_PAD_TEXT: " "
    DISABLE_IP_LOGGING: "true"
    TRUST_PROXY: "true"
    # Disable outgoing network calls
    UPDATES_TIER: "off"
    PRIVACY_UPDATE_CHECK: "false"
    PRIVACY_PLUGIN_CATALOG: "false"

  extraVolumes:
    - name: tmp
      emptyDir: {}
    # move to a persistent volume
    - name: data
      emptyDir: {}

  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
    # move to a persistent volume
    - name: data
      mountPath: /opt/etherpad-lite/var

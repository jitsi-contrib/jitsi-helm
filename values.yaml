# Default values for jitsi-meet.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # Set your cluster's DNS domain here.
  # "cluster.local" should work for most environments.
  # Set to "" to disable the use of FQDNs (default in older chart versions).
  clusterDomain: cluster.local
  podLabels: {}
  podAnnotations: {}
  releaseSecretsOverride:
    enabled: false
    # Environment variables from secrets created outside the chart, for example
    # by the 1Password or the External Secrets operator. Every component gets
    # these sources, and they come last, so they override the values the chart
    # provides itself. The list is ignored unless enabled is true as well.
    #extraEnvFrom:
    #  - secretRef:
    #      name: '{{ .Release.Name }}-overrides'
    #      optional: true

nameOverride: ""
fullnameOverride: ""
tz: Europe/Amsterdam

imagePullSecrets: []
image:
  pullPolicy: IfNotPresent

# Where Jitsi Web UI is made available
# such as https://jitsi.example.com
publicURL: ""

# Where TURN service is made available
# such as turn.example.com
turnHost: ""

enableAuth: false
enableGuests: true

# WebSocket configuration:
#
# The XMPP WebSocket is disabled by default, since some LoadBalancer / Reverse
# Proxy setups can't pass WebSocket connections properly, which might result in
# breakage for some clients. Enable it to replicate the current upstream
# `meet.jit.si` setup.
websockets:
  # XMPP (Prosody signalling)
  xmpp:
    enabled: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname
  # template
  name:

xmpp:
  domain: meet.jitsi
  authDomain:
  mucDomain:
  internalMucDomain:
  guestDomain:
  hiddenDomain:

extraCommonEnvs: {}

## #############################################################################
## Web configuration
## #############################################################################
web:
  replicaCount: 1

  image:
    repository: ghcr.io/jitsi/web
    # If the tag is not set here then it is retrieved from Chart.yaml
    #tag:

  # Override the image-provided configuration files:
  # See https://github.com/jitsi/docker-jitsi-meet/tree/master/web/rootfs
  custom:
    configs:
      _custom_config_js: ""
      _custom_interface_config_js: ""
    defaults:
      _default: ""
      _ffdhe2048_txt: ""
      _interface_config_js: ""
      _meet_conf: ""
      _nginx_conf: ""
      _settings_config_js: ""
      _ssl_conf: ""
      _system_config_js: ""
    scripts:
      _config: ""

  extraFiles: []
  # - path: /config/nginx-custom/oidc.conf
  #   content: |
  #       location ~ /oidc/ {
  #           proxy_pass http://127.0.0.1:9000;
  #           proxy_http_version 1.1;
  #           proxy_set_header X-Forwarded-For $remote_addr;
  #           proxy_set_header Host $http_host;
  #       }
  # - path: /etc/s6-overlay/scripts/my-helper
  #   mode: "0755"
  #   content: |
  #     #!/usr/bin/env bash
  #     echo "Hello"

  service:
    type: ClusterIP
    port: 80
    # If you want to expose the Jitsi Web service directly
    # (bypassing gateway or ingress), use this:
    #type: NodePort
    #nodePort: 30580
    #port: 80
    externalIPs: []
    # Annotations to be added to the service (if LoadBalancer is used)
    # An example below is needed for GKE IAP enablement
    annotations: {}
    #  beta.cloud.google.com/backend-config: backend-config-iap

  gateway:
    enabled: false
    gatewayClassName: envoy-gateway-class
    annotations: {}
    host: "jitsi.local"
    paths:
      - "/"
    tls:
      enabled: false
      secretName: jitsi-web-tls

  ingress:
    enabled: false
    # ingressClassName: nginx-ingress-0
    annotations: {}
    #  kubernetes.io/tls-acme: "true"
    hosts:
      - host: "jitsi.local"
        paths:
          - "/"
    tls: []
    #  - secretName: jitsi-web-tls
    #    hosts:
    #      - "jitsi.local"

  # Useful for ingresses that don't support http-to-https redirect by themself,
  # (namely: GKE),
  httpRedirect: false

  # Resolver IP for nginx.
  #
  # Starting with version `stable-8044`, the web container can
  # auto-detect the nameserver from /etc/resolv.conf.
  # Use this option if you want to override the nameserver IP.
  #resolverIP: 10.43.0.10

  # User-supplied init containers, appended after any the chart adds itself.
  # Not templated and not hardened by the chart, each entry brings its own
  # securityContext.
  #
  # Each entry runs to completion before the main container starts. An entry
  # that sets "restartPolicy: Always" is a native sidecar instead. It only has
  # to start, then keeps running beside the main container and is stopped after
  # it (Kubernetes 1.29 and later).
  extraInitContainers: []
  #  - name: init-example
  #    image: busybox:1.38.0
  #    command: ["sh", "-c", "echo init"]

  extraContainers: []
  #  - name: jitsi-oidc-adapter
  #    image: ghcr.io/jitsi-contrib/jitsi-oidc-adapter
  #    imagePullPolicy: IfNotPresent
  #    ports:
  #      - name: http
  #        containerPort: 9000
  #    resources:
  #      requests:
  #        cpu: 50m
  #        memory: 64Mi
  #      limits:
  #        cpu: 200m
  #        memory: 256Mi

  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10

  affinity: {}
  annotations: {}
  automountServiceAccountToken: false
  extraEnvFrom: []
  extraEnvs: {}
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []
  labels: {}
  nodeSelector: {}
  resources: {}
  # We usually recommend not to specify default resources and to leave this as a
  # conscious choice for the user. This also increases chances charts run on
  # environments with little resources, such as Minikube. If you do want to
  # specify resources, uncomment the following lines, adjust them as necessary,
  # and remove the curly braces after 'resources:'
  #  limits:
  #    cpu: 100m
  #    memory: 128Mi
  #  requests:
  #    cpu: 100m
  #    memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  strategy: {}
  tolerations: []

## #############################################################################
## Etherpad configuration
## #############################################################################
etherpad:
  enabled: false

  # Always one replica, hardcoded in etherpad/deployment.yaml
  # replicaCount: 1

  image:
    repository: etherpad/etherpad
    tag: 3.3.3

  service:
    type: ClusterIP
    port: 9001
    # Annotations to be added to the service
    annotations: {}

  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10

  affinity: {}
  annotations: {}
  automountServiceAccountToken: false
  extraEnvFrom: []
  extraEnvs:
    NODE_ENV: production
    ADMIN_PASSWORD: admin
    # Select a supported database from here:
    #   https://www.npmjs.com/package/ueberdb2
    # By default, it uses Sqlite.
    DB_TYPE: "sqlite"
    DB_FILENAME: "var/etherpad.sq3"
    # Configure other database parameters (e.g. for Postgres)
    #DB_USER: etherpad
    #DB_HOST: postgres
    #DB_NAME: etherpad
    #DB_PASS: etherpad
    #DB_PORT: 5432
    # For now, DEFAULT_PAD_TEXT cannot be unset or empty.
    # It seems to be mandatory in the latest version of Etherpad.
    DEFAULT_PAD_TEXT: " "
    DISABLE_IP_LOGGING: "true"
    TRUST_PROXY: "true"
  extraFiles: []
  extraInitContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []
  labels: {}
  nodeSelector: {}
  resources: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  # Hardening that holds regardless of the image. Unlike the jitsi components,
  # this is a third-party image, so runAsUser/runAsGroup/runAsNonRoot,
  # readOnlyRootFilesystem and podSecurityContext.fsGroup stay unset until a
  # live test shows which user it runs as and which paths it writes to.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    seccompProfile:
      type: RuntimeDefault
  strategy: {}
  tolerations: []


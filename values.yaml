## #############################################################################
## opus-transcriber-proxy configuration
## #############################################################################
opusTranscriberProxy:
  # Enabling this rolls out the new bridge-based transcription pipeline
  # (see https://jitsi.github.io/handbook/docs/devops-guide/transcription/).
  # Mutually exclusive with transcriber.enabled (the old, deprecated
  # Jigasi-based transcription path) - the chart refuses to render if both
  # are true.
  #
  # Enabling this is not enough on its own. The Prosody module that marks the
  # rooms ships with the image, but is not enabled. Add it to the module list
  # yourself, otherwise the bridge-based path stays unused silently:
  #
  #   prosody:
  #     extraEnvs:
  #       XMPP_MUC_MODULES: "force_async_transcription"
  enabled: false

  # Always one replica, hardcoded in opus-transcriber-proxy/deployment.yaml
  # replicaCount: 1

  image:
    # opus-transcriber-proxy is released independently from Jitsi (unlike
    # web/prosody/jicofo/jvb/jigasi/jibri, which are built together in
    # docker-jitsi-meet and published to ghcr.io/jitsi/*), so the tag is
    # pinned here rather than derived from Chart.AppVersion. It's also only
    # published to Docker Hub, not ghcr.io.
    #
    # The project publishes no version tags, only "latest" and a tag per
    # commit, and "latest" moves on every push. So a commit tag is pinned
    # here. Append a digest (tag: <commit>@sha256:<hash>) if you want the
    # image to be immutable.
    repository: jitsi/opus-transcriber-proxy
    tag: e74cae2

  service:
    type: ClusterIP
    port: 8080
    # Annotations to be added to the service
    annotations: {}

  # Interface opus-transcriber-proxy listens on inside the pod.
  host: "0.0.0.0"

  # API keys of the speech-to-text providers in use. Use the env var names
  # documented at https://github.com/jitsi/opus-transcriber-proxy#readme.
  apiKeys: {}
  #  OPENAI_API_KEY: ""
  #  DEEPGRAM_API_KEY: ""
  # Alternatively provide a name for an externally managed secret containing
  # the values for these keys
  existingSecretName:

  # Provider and runtime settings. Use the env var names documented at
  # https://github.com/jitsi/opus-transcriber-proxy#readme. Don't set
  # PORT/HOST here, use service.port and host above instead.
  # These go into a configmap, use apiKeys above for the credentials.
  extraEnvs: {}
  #  PROVIDERS_PRIORITY: "openai"
  #  OPENAI_MODEL: "gpt-4o-mini-transcribe"

  livenessProbe:
    tcpSocket:
      port: http
    periodSeconds: 10

  readinessProbe:
    tcpSocket:
      port: http
    periodSeconds: 10

  affinity: {}
  annotations: {}
  automountServiceAccountToken: false
  extraEnvFrom: []
  extraFiles: []
  extraInitContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []
  labels: {}
  nodeSelector: {}
  resources: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  # Hardening that holds regardless of the image. Unlike the jitsi components,
  # this is a third-party image, so runAsUser/runAsGroup/runAsNonRoot,
  # readOnlyRootFilesystem and podSecurityContext.fsGroup stay unset until a
  # live test shows which user it runs as and which paths it writes to.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    seccompProfile:
      type: RuntimeDefault
  strategy: {}
  tolerations: []


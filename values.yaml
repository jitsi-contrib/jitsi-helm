## #############################################################################
## Coturn configuration
## #############################################################################
# STUN and TURN over UDP/3478. Media packages are still encrypted with DTLS-SRTP
# Optional TURNS (TURN over TLS on TCP/443) support.
coturn:
  enabled: false

  replicaCount: 1

  image:
    repository: coturn/coturn
    tag: "4.17.2"

  custom:
    configs:
      _turnserver_conf: ""

  staticAuth:
    # Generated when unset, then kept across upgrades.
    secret:
    # Alternatively provide a name for an externally managed secret containing
    # the value for TURN_CREDENTIALS
    existingSecretName:

  turn:
    transport: "udp"

  # TURNS (TURN over TLS) configuration
  # Relay ports use pod networking (internal cluster access only).
  # - TCP/443 is exposed via LoadBalancer service for TURNS control connection
  # - UDP relay ports remain internal on pod IP
  # - JVB sends media to relay via internal pod-to-pod UDP
  # - Requires coturn.allowedPeerIPs set to pod/node CIDR for relay to JVB
  turns:
    enabled: false
    relayPortRange:
      min: 50000
      max: 54999
    certificate:
      # Create Certificate resource using cert-manager
      create: true
      # ClusterIssuer or Issuer to use
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer
        group: cert-manager.io
      # Or use existing TLS secret (requires tls.crt and tls.key)
      existingSecretName: ""

      # ACME challenge proxy - enables certificate validation when
      # TURN runs on separate IP from ingress controller
      # This will proxy ACME challenges to the specified ingress
      # Requires Kubernetes native sidecar containers support
      acmeProxy:
        enabled: false
        # Internal cluster address of ingress controller
        # Defaults to traefik service in "traefik" namespace
        target: traefik.traefik.svc.cluster.local
        targetPort: 80

  service:
    type: LoadBalancer
    # NodePort allocation when using LoadBalancer service
    allocateLoadBalancerNodePorts: true
    ports:
      turn: 3478
      turns: 443
    # Optional: Specifies the LoadBalancer controller to use (since K8s v1.24).
    # If left empty (null), the default cluster controller will be used.
    # Example values: "service.k8s.aws/nlb", "loxilb.io/loxilb"
    #loadBalancerClass: null
    # Annotations to be added to the service (if LoadBalancer is used)
    annotations: {}

  # The JVB's public IP addresses are expected to be directly accessible by
  # Coturn in the production environment.
  # allowedPeerIPs is required when Coturn cannot directly access JVBs through
  # their public IPs. In this case, set to your cluster's node/pod range to
  # allow coturn to relay to JVB
  allowedPeerIPs: []
  #allowedPeerIPs:
  #  - "10.244.0.0-10.244.255.255"
  #  - "100.64.0.0-100.127.255.255"

  livenessProbe:
    tcpSocket:
      port: tcp-turn
    periodSeconds: 10

  readinessProbe:
    tcpSocket:
      port: tcp-turn
    periodSeconds: 10

  initContainers:
    busybox:
      image: busybox:1.38.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    acmeProxy:
      image: nginx:alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

  # Native Prometheus metrics for Coturn (port 9641)
  metrics:
    enabled: false
    serviceMonitor:
      enabled: true
      selector:
        release: prometheus-operator
      interval: 10s
      # honorLabels: false

  affinity: {}
  annotations: {}
  automountServiceAccountToken: false
  extraEnvFrom: []
  extraEnvs: {}
  extraFiles: []
  extraInitContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []
  labels: {}
  nodeSelector: {}
  resources: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      # The turnserver binary carries this as a file capability. Without it
      # here, the kernel refuses to execute the binary at all.
      add:
        - NET_BIND_SERVICE
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  strategy: {}
  tolerations: []

## #############################################################################
## Prosody configuration
## #############################################################################
prosody:
  # Always one replica, hardcoded in prosody/statefulset.yaml
  # replicaCount: 1

  image:
    repository: ghcr.io/jitsi/prosody
    # If the tag is not set here then it is retrieved from Chart.yaml
    #tag:

  # Override the image-provided configuration files:
  # See https://github.com/jitsi/docker-jitsi-meet/tree/master/prosody/rootfs
  custom:
    defaults:
      _jitsi_meet_cfg_lua: ""
      _prosody_cfg_lua: ""
      _saslauthd_conf: ""
    scripts:
      _config: ""

  # JWT secret.
  # Required only if authentication type is "token" or "hybrid_matrix_token"
  jwt:
    secret:
    # Alternatively provide a name for an externally managed secret containing
    # the values for JWT_APP_SECRET
    existingSecretName:

  service:
    type: ClusterIP
    ports:
      bosh-insecure: 5280
      bosh-secure: 5281
      xmpp-c2s: 5222
      xmpp-s2s: 5269
      xmpp-component: 5347
    # Annotations to be added to the service
    annotations: {}

  livenessProbe:
    httpGet:
      path: /http-bind
      port: bosh-insecure
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /http-bind
      port: bosh-insecure
    periodSeconds: 10

  # Persistence is needed if user accounts are stored in Prosody.
  # e.g. internal_hashed as authentication.
  # The volume is mounted at /var/lib/prosody. Prosody keeps its data in the
  # data subfolder.
  persistence:
    enabled: false
    size: 3G
    # Set this to existing PVC name if you have one.
    existingClaim:
    storageClassName:

  extraVolumes: []
  #  - name: prosody-modules
  #    configMap:
  #      name: prosody-modules

  extraVolumeMounts: []
  #  - name: prosody-modules
  #    subPath: mod_measure_client_presence.lua
  #    mountPath: /prosody-plugins-custom/mod_measure_client_presence.lua

  extraSecrets: []
  #  - name: "JWT_APP_SECRET"
  #    valueFrom:
  #      secretKeyRef:
  #        name: "my-application-secrets"
  #        key: "JITSI_JWT_SECRET"

  extraEnvFrom: []
  #  - secretRef:
  #      name: "my-application-secrets"
  #  - configMapRef:
  #      name: "my-application-configmap"

  metrics:
    enabled: false
    allowed_cidr: "0.0.0.0/0" # change to cluster pod ip cidr
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.76.1"
      pullPolicy: IfNotPresent
    serviceMonitor:
      enabled: true
      selector:
        release: prometheus-operator
      interval: 10s
      #honorLabels: false
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

  affinity: {}
  annotations: {}
  automountServiceAccountToken: false
  extraEnvs: {}
  extraFiles: []
  extraInitContainers: []
  hostAliases: []
  labels: {}
  nodeSelector: {}
  resources: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  tolerations: []


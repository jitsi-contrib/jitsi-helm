    #tag:

  # Override the image-provided configuration files. The Transcriber runs the
  # Jigasi image:
  # See https://github.com/jitsi/docker-jitsi-meet/tree/master/jigasi/rootfs
  custom:
    defaults:
      _autoscaler_sidecar_config: ""
      _logging_properties: ""
      _sip_communicator_properties: ""
      _sipserver_sip_communicator_properties: ""
      _transcriber_sip_communicator_properties: ""
      _xmpp_sip_communicator_properties: ""
    scripts:
      _config: ""

  # Transcriber XMPP user credentials
  # Transcriber also requires credentials for Jigasi, even if its pod is
  # disabled.
  xmpp:
    user: transcriber
    # Generated when unset, then kept across upgrades.
    password:
    # Alternatively provide a name for an externally managed secret containing

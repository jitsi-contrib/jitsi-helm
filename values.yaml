## #############################################################################
## JVB configuration
## #############################################################################
jvb:
  replicaCount: 1

  image:
    repository: ghcr.io/jitsi/jvb
    # If the tag is not set here then it is retrieved from Chart.yaml
    #tag:

  # Override the image-provided configuration files:
  # See https://github.com/jitsi/docker-jitsi-meet/tree/master/jvb/rootfs
  custom:
    configs:
      _custom_jvb_conf: ""
    defaults:
      _autoscaler_sidecar_config: ""
      _jvb_conf: ""
      _logging_properties: ""
    scripts:
      _config: ""

  breweryMuc: jvbbrewery

  # JVB XMPP user credentials
  xmpp:
    user: jvb
    # Generated when unset, then kept across upgrades.
    password:
    # Alternatively provide a name for an externally managed secret containing
    # the values for JVB_AUTH_USER, JVB_AUTH_PASSWORD
    existingSecretName:

  # Set public IP addresses to be advertised by JVB.
  # You can specify your nodes' IP addresses,
  # or IP addresses of proxies/LoadBalancers used for your
  # Jitsi Meet installation. Or both!
  #publicIPs:
  #  - 1.2.3.4
  #  - 5.6.7.8
  # Alternative option: advertise the IP address of the node the pod runs on.
  # This is the pod's status.hostIP, which is the node's InternalIP and not its
  # ExternalIP.
  useNodeIP: false

  # JVB uses STUN to learn the address it is seen from, and advertises that
  # address to the clients. A STUN server outside the cluster sees JVB's
  # public address. One inside the cluster sees its internal address.
  #
  # Precedence (first match wins):
  #   1. disableStun: true          STUN disabled
  #   2. useInternalStun (+ coturn) the chart's coturn, through turnHost
  #   3. stunServers (non-empty)    that external STUN server
  #   4. otherwise                  STUN disabled

  # External STUN server used to find JVB's external IP.
  stunServers: "meet-jit-si-turnrelay.jitsi.net:443"
  # Use the chart's own coturn as the STUN server, through turnHost. JVB then
  # advertises the address coturn sees: the public one if the request leaves
  # the cluster, the internal one if it does not. That internal address is
  # useful only when JVB is not publicly accessible at all, so the clients
  # reach it through coturn's relay. Requires coturn.enabled, turnHost and
  # coturn.turn.transport: udp, since STUN queries are UDP.
  useInternalStun: false
  # Explicitly disable STUN, overriding useInternalStun and stunServers. Use
  # this when publicIPs (or useNodeIP) is set explicitly and JVB does not need
  # STUN to discover its IP.
  disableStun: false

  # Try to use the hostPort feature:
  # (might not be supported by some clouds or CNI engines)
  useHostPort: false
  # Use host's network namespace:
  # (not recommended, but might help for some cases)
  useHostNetwork: false
  # UDP transport port:
  UDPPort: 10000
  # Number of consecutive ports to allocate, one JVB per port.
  # If set to 1, only UDPPort is used (legacy behavior).
  # If > 1, UDPPort is the base and the JVBs listen on UDPPort, UDPPort+1, ...
  portRangeSize: 1
  # Use a pre-defined external port for NodePort or LoadBalancer service,
  # if needed. Will allocate a random port from allowed range if unset.
  # (Default NodePort range for K8s is 30000-32767)
  # If portRangeSize > 1, this is the base of a consecutive range.
  #nodePort: 10000

  service:
    # When the service is enabled, JVB's replicaCount must be 1: all pods of a
    # deployment are reachable on the same service port. In this case use
    # portRangeSize to run more than one JVB.
    enabled: true
    type: ClusterIP
    externalTrafficPolicy: Cluster
    externalIPs: []
    # Optional: Specifies the LoadBalancer controller to use (since K8s v1.24).
    # If left empty (null), the default cluster controller will be used.
    # Example values: "service.k8s.aws/nlb", "loxilb.io/loxilb"
    #loadBalancerClass: null
    # Optional: Ask the provider for a specific public IP. Kubernetes deprecated
    # this field in v1.24 and some providers ignore it, expecting a
    # provider-specific annotation instead. See annotations below.
    # This only pins the address, it doesn't set the IP advertised by JVB.
    # Set publicIPs to the same address as well.
    #loadBalancerIP: 1.2.3.4
    # If type is set to LoadBalancer and the cluster is dual stack,
    # ipFamilyPolicy can be set to enable dual stack addressing for the service
    #ipFamilyPolicy: PreferDualStack
    # Annotations to be added to the service (if LoadBalancer is used)
    # An example below is needed for DigitalOcean managed k8s setups
    # with a LoadBalancer service, so that DO's external LB can perform
    # health checks on JVB.
    annotations: {}
    #  service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: "8080"
    #  service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "tcp"
    # Add extra ports to the service.
    # An example below is needed for DigitalOcean managed k8s setups.
    extraPorts: []
    #  - name: http-healthcheck
    #    port: 8080
    #    protocol: TCP

  livenessProbe:
    httpGet:
      path: /about/health
      port: http
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /about/health
      port: http
    periodSeconds: 10

  metrics:
    enabled: false
    image:
      repository: docker.io/systemli/prometheus-jitsi-meet-exporter
      tag: 1.4.2
      pullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 10001
      runAsNonRoot: true
      # this image expects uid 10001
      runAsUser: 10001
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 20m
        memory: 32Mi

    prometheusAnnotations: false
    serviceMonitor:
      enabled: true
      selector:
        release: prometheus-operator
      interval: 10s
      # honorLabels: false

    grafanaDashboards:
      enabled: false
      labels:
        grafana_dashboard: "1"
      annotations: {}

  affinity: {}
  annotations: {}
  automountServiceAccountToken: false
  extraEnvFrom: []
  extraEnvs: {}
  extraFiles: []
  extraInitContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  hostAliases: []
  labels: {}
  nodeSelector: {}
  resources: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  # Ignored when useHostPort is set, where Recreate is forced.
  strategy: {}
  tolerations: []


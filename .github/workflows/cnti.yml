# Installs the chart on a kind cluster every night and runs the CNTi Test
# Suite's cert tests against it. The CNTi badge in the README shows this
# workflow's status.
#
# Maintained by the CNTi project. Background: issue #281. For problems
# with the action or the test suite, open an issue at
# https://github.com/lfn-cnti/testsuite-action/issues
name: CNTi cert

on:
  schedule:
    # Off the full hour: GitHub delays or drops scheduled runs under load,
    # which peaks at the start of each hour.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cert:
    # Forks that enable scheduled workflows do not run it.
    if: github.repository == 'jitsi-contrib/jitsi-helm'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: lfn-cnti/testsuite-action@05a9860905f31c6813f735d25e5cefd7c62a1e5a # v1.1.0
        with:
          version: v2.1.0
          cnf_config: .github/cnti/cnti-testsuite.yaml
          tests: cert

      # Why did a component not come up? Pod state and events from the kind
      # cluster the action created; it lives until the job ends.
      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl get pods -A -o wide
          kubectl get events -n jitsi-cnti --sort-by=.lastTimestamp | tail -40
